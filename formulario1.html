<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario_1</title>
</head>
<body>
<p>3)</p>

<p><strong>MANUTENÇÃO DE USUÁRIOS DO SISTEMAS INTERNO</strong></p>
<form action="*" method="post" >
    <p><b><label for="ilogin"> Login:</label></b>
        <input type="text" name="Login" size="15" maxlength="30" id="ilogin" required="required" />
    </p>
    <p><b><label for="isenha">Senha:</label></b> 
        <input type="password" name="Senha" size="15" maxlength="30" id="isenha" required="required"/>
    </p>
    
    <p><b>Status:</b>
        <select name="devices">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
            <option value="pendente">Pendente</option>
        </select>
    </p>
    
    <p><b>Tipo:</b>
        <b><label for="itecnico"><input type="radio" name="genre" value="Tecnico" id="itecnico" /> Técnico</label></b>
        <b><label for="iprofessor"><input type="radio" name="genre" value="Professor" id="iprofessor" /> Professor</label></b>
        <b><label for="ialuno"><input type="radio" name="genre" value="Aluno" id="ialuno" /> Aluno</label></b>
    </p>
    
    <p>
      <b><label for="idata">Data de criação</label></b>
      <input type="date" name="depart" id="idata" required="required"/>
    </p>
    
    <p><b>Perfil</b>
    <b><label for="iconvidado"><input type="radio" name="acesso" id="iconvidado" value="convidado"  />Convidado</label></b>
    <b><label for="iadministrador"><input type="radio" name="acesso" id="iadministrador" value="administrador" />Administrador</label></b>
    </p>
    
    <p><b><label for="iobservacao">Observações:</label></b>
        <textarea name="Observações" rows="6" cols="30" id="iobservacao"></textarea>
    </p>
    
    <p>
    <b>Módulos</b>
    <b><label for="icompra"><input type="checkbox" name="opcoes" id="icompra" value="compras" />Compra</label></b>
    <b><label for="ibiblioteca"><input type="checkbox" name="opcoes2" id="ibiblioteca" value="biblioteca" />Biblioteca</label></b>
    <b><label for="iacademico"><input type="checkbox" name="opcoes3" id="iacademico" value="academico" />Académico </label></b>
    <br />
    </p>
    <p style="margin-left: 64px;">    
    <b><label for="idocumentacao"><input type="checkbox" name="opcoes4" id="idocumentacao" value="documentação" />Documentação</label></b>
    <b><label for="irh"><input type="checkbox" name="opcoes5" id="irh" value="RH" />Recursos Humanos</label></b>
    </p>
    
    <p>
    <input type="submit" name="enviar" id="ienviar" value="Cadastrar" />
    <input type="reset" name="excluir" id="iexcluir" value="Limpar" />
    </p>
</form>





</body>
</html>
